<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision Hub</title>
<meta name="description" content="Vision Hub: curated referral apps, affiliate links and digital products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Google Auto Ads: publisher ID from AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4142935752244508" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root { --ink:#0d1015; --panel:#161b22; --line:#262d38; --text:#e9e5dc; --muted:#8b93a1; --amber:#f5b547; --teal:#3fb8af; }
  body { background:var(--ink); color:var(--text); font-family:Inter, system-ui, sans-serif; }
  h1,h2,.brand { font-family:Fraunces, Georgia, serif; }
  .brand-bar { background:linear-gradient(120deg,#1a1430 0%,#0d2a2d 55%,#2a1d0c 100%); border-bottom:1px solid var(--line); }
  .card { transition:transform .2s ease, border-color .2s ease; }
  .card:hover { transform:translateY(-3px); border-color:var(--amber); }
  .chip-on { background:var(--amber); color:#14110a; border-color:var(--amber); }
  .btn { border:1px solid var(--line); border-radius:.6rem; padding:.45rem .8rem; font-size:.85rem; transition:background .15s; }
  .btn:hover { background:#1e2530; }
  .btn-primary { background:var(--amber); color:#14110a; border-color:var(--amber); font-weight:600; }
  .btn-primary:hover { background:#ffc466; }
  .field { width:100%; background:#0f1319; border:1px solid var(--line); border-radius:.6rem; padding:.6rem .75rem; color:var(--text); outline:none; }
  .field:focus, .btn:focus-visible, a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .card { transition:none; } .card:hover { transform:none; } }
</style>
</head>
<body class="min-h-screen">

<header class="brand-bar sticky top-0 z-40 backdrop-blur" style="padding-top:env(safe-area-inset-top,0px)">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
    <a href="#" class="brand text-2xl font-extrabold tracking-tight">Vision <span style="color:var(--amber)">Hub</span></a>
    <div class="flex items-center gap-2">
      <img id="avatarImg" alt="Profile picture" class="h-9 w-9 rounded-full object-cover border border-white/20 bg-[#161b22]">
      <div id="adminBar" class="items-center gap-2" style="display:none">
        <button id="newBtn" class="btn btn-primary">+ New post</button>
        <button id="passBtn" class="btn hidden sm:inline-block">Passcode</button>
        <button id="profileBtn" class="btn hidden sm:inline-block">Edit profile</button>
        <button id="logoutBtn" class="btn">Logout</button>
        
      </div>
      <button id="loginBtn" class="btn">Admin login</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 pb-16">
  <section class="pt-10 pb-6">
    <h1 class="text-3xl sm:text-4xl font-extrabold leading-tight max-w-2xl">Tools, apps and digital products worth your time.</h1>
    <p class="text-[var(--muted)] mt-3 max-w-xl">Every pick is listed with its benefits. Copy a referral link in one tap.</p>
  </section>

  <div class="sticky top-16 z-30 py-3" style="background:var(--ink)">
    <label class="sr-only" for="search">Search posts by keyword or upload ID</label>
    <input id="search" type="search" class="field text-base" placeholder="Search keywords, or an ID like 01, #01 or 1" autocomplete="off">
    <div id="chips" class="flex gap-2 overflow-x-auto pt-3 pb-1" style="scrollbar-width:none"></div>
  </div>

  <p id="count" class="text-sm text-[var(--muted)] mt-2 mb-4"></p>
  <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  <div id="empty" class="hidden text-center text-[var(--muted)] border border-dashed border-[var(--line)] rounded-2xl p-10 mt-4">
    Nothing matches. Try another keyword or clear the filter.
  </div>
</main>

<!-- Login modal -->
<div id="loginModal" class="modal fixed inset-0 z-50 bg-black/70 p-4 items-center justify-center" style="display:none">
  <form id="loginForm" class="w-full max-w-sm bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-6 space-y-4">
    <h2 class="text-xl font-bold">Admin login</h2>
    <input id="loginPw" type="password" class="field" placeholder="Master passcode" autocomplete="current-password" required>
    <p id="loginErr" class="text-sm text-rose-400 min-h-[1.25rem]"></p>
    <div class="flex justify-end gap-2"><button type="button" data-close class="btn">Cancel</button><button class="btn btn-primary">Unlock</button></div>
  </form>
</div>

<!-- Post modal -->
<div id="postModal" class="modal fixed inset-0 z-50 bg-black/70 p-4 items-center justify-center" style="display:none">
  <form id="postForm" class="w-full max-w-lg max-h-[90vh] overflow-y-auto bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-6 space-y-3">
    <h2 id="postTitle" class="text-xl font-bold">New post</h2>
    <input name="title" class="field" placeholder="Title" required maxlength="80">
    <select name="cat" class="field" id="catSelect"></select>
    <input name="link" type="url" class="field" placeholder="Referral link (https://…)" required>
    <input name="desc" class="field" placeholder="Short description" required maxlength="160">
    <textarea name="benefits" class="field" rows="4" placeholder="Detailed benefits (one per line)" required></textarea>
    <label class="block text-sm text-[var(--muted)]">Icon image (upload, or paste a URL)</label>
    <input name="iconFile" type="file" accept="image/*" class="text-sm text-[var(--muted)]">
    <input name="iconUrl" type="url" class="field" placeholder="https://… image URL (optional)">
    <div class="flex justify-end gap-2 pt-2"><button type="button" data-close class="btn">Cancel</button><button class="btn btn-primary">Save post</button></div>
  </form>
</div>

<!-- Profile modal -->
<div id="profileModal" class="modal fixed inset-0 z-50 bg-black/70 p-4 items-center justify-center" style="display:none">
  <form id="profileForm" class="w-full max-w-sm bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-6 space-y-3">
    <h2 class="text-xl font-bold">Edit profile picture</h2>
    <input name="file" type="file" accept="image/*" class="text-sm text-[var(--muted)]">
    <input name="url" type="url" class="field" placeholder="…or paste an image URL">
    <div class="flex justify-between gap-2 pt-2">
      <button type="button" id="avatarReset" class="btn">Remove</button>
      <div class="flex gap-2"><button type="button" data-close class="btn">Cancel</button><button class="btn btn-primary">Save</button></div>
    </div>
  </form>
</div>

<!-- Passcode modal -->
<div id="passModal" class="modal fixed inset-0 z-50 bg-black/70 p-4 items-center justify-center" style="display:none">
  <form id="passForm" class="w-full max-w-sm bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-6 space-y-3">
    <h2 class="text-xl font-bold">Change passcode</h2>
    <input name="cur" type="password" class="field" placeholder="Current passcode" required autocomplete="current-password">
    <input name="next" type="password" class="field" placeholder="New passcode (8+ characters)" required minlength="8" autocomplete="new-password">
    <input name="confirm" type="password" class="field" placeholder="Confirm new passcode" required minlength="8" autocomplete="new-password">
    <p id="passErr" class="text-sm text-rose-400 min-h-[1.25rem]"></p>
    <div class="flex justify-end gap-2"><button type="button" data-close class="btn">Cancel</button><button class="btn btn-primary">Update</button></div>
  </form>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] px-4 py-2 rounded-lg bg-[var(--panel)] border border-[var(--line)] text-sm shadow-xl" style="display:none"></div>

<script>
const DEFAULT_PASS = 'Sanskar@9049';
const CATS = ['Finance', 'Gaming', 'Shopping', 'Crypto', 'Tools', 'Other'];
const KEY = { posts: 'vh_posts', seq: 'vh_seq', hash: 'vh_pass_hash', avatar: 'vh_avatar', fails: 'vh_fails', lock: 'vh_lock' };
const IDLE_MS = 15 * 60 * 1000, LOCK_MS = 5 * 60 * 1000, MAX_FAILS = 5;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const show = (el, on, d = 'flex') => el.style.display = on ? d : 'none';

let posts = load(KEY.posts, []);
let avatar = load(KEY.avatar, '');
const ui = { admin: false, cat: 'All', q: '', editId: null };
let idleTimer, toastTimer;

/* ---------- Security: SHA-256 via Web Crypto ---------- */
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function currentHash() {
  return localStorage.getItem(KEY.hash) || sha256(DEFAULT_PASS);
}

/* ---------- Toast ---------- */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; show(t, true, 'block');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => show(t, false), 2600);
}

/* ---------- Persistence ---------- */
function persist() {
  try { store(KEY.posts, posts); return true; }
  catch { toast('Storage is full. Use a smaller icon image.'); return false; }
}

/* ---------- Image helper: downscale uploads to keep localStorage light ---------- */
function fileToDataURL(file, max = 256) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- Admin session ---------- */
function setAdmin(on) {
  ui.admin = on;
  show($('#adminBar'), on);
  show($('#loginBtn'), !on && location.hash === '#admin', 'inline-block');
  clearTimeout(idleTimer);
  if (on) resetIdle();
  renderAvatar();
  renderGrid();
}
function resetIdle() {
  if (!ui.admin) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { setAdmin(false); toast('Logged out after 15 minutes of inactivity.'); }, IDLE_MS);
}
['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(ev =>
  addEventListener(ev, resetIdle, { passive: true }));

function renderAvatar() {
  const img = $('#avatarImg');
  img.style.display = avatar ? '' : 'none';
  img.src = avatar || 'data:image/svg+xml,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='#262d38'/><circle cx='20' cy='16' r='7' fill='#8b93a1'/><path d='M6 38c2-8 26-8 28 0' fill='#8b93a1'/></svg>");
}

/* ---------- Login with brute-force lockout ---------- */
async function attemptLogin(pw) {
  const lockedUntil = load(KEY.lock, 0);
  if (Date.now() < lockedUntil) {
    const mins = Math.ceil((lockedUntil - Date.now()) / 60000);
    return $('#loginErr').textContent = `Too many attempts. Try again in ${mins} min.`;
  }
  if (await sha256(pw) === await currentHash()) {
    store(KEY.fails, 0); localStorage.removeItem(KEY.lock);
    show($('#loginModal'), false); $('#loginForm').reset(); $('#loginErr').textContent = '';
    setAdmin(true); toast('Welcome back, admin.');
    return;
  }
  const fails = load(KEY.fails, 0) + 1;
  if (fails >= MAX_FAILS) {
    store(KEY.lock, Date.now() + LOCK_MS); store(KEY.fails, 0);
    $('#loginErr').textContent = 'Locked for 5 minutes after 5 failed attempts.';
  } else {
    store(KEY.fails, fails);
    $('#loginErr').textContent = `Wrong passcode. ${MAX_FAILS - fails} attempt(s) left.`;
  }
}

/* ---------- Search and filters ---------- */
function matches(p) {
  if (ui.cat !== 'All' && p.cat !== ui.cat) return false;
  const q = ui.q.trim();
  if (!q) return true;
  const digits = q.replace(/^#/, '');
  if (/^\d+$/.test(digits)) return p.id === digits.padStart(2, '0');
  const t = q.toLowerCase();
  return [p.title, p.cat, p.desc, p.benefits].some(v => String(v).toLowerCase().includes(t));
}

function renderChips() {
  $('#chips').innerHTML = ['All', ...CATS].map(c =>
    `<button data-cat="${c}" class="btn whitespace-nowrap ${ui.cat === c ? 'chip-on' : ''}">${c}</button>`).join('');
}

/* ---------- Cards ---------- */
function cardHTML(p) {
  const icon = p.icon
    ? `<img src="${esc(p.icon)}" alt="" class="h-12 w-12 rounded-xl object-cover bg-[#0f1319]">`
    : `<div class="h-12 w-12 rounded-xl grid place-items-center text-lg font-extrabold brand" style="background:var(--line);color:var(--amber)">${esc((p.title || '?')[0].toUpperCase())}</div>`;
  const admin = ui.admin ? `
    <button data-edit="${p.id}" class="btn">Edit</button>
    <button data-del="${p.id}" class="btn text-rose-400">Delete</button>` : '';
  return `
  <article class="card rounded-2xl border border-[var(--line)] bg-[var(--panel)] p-5 flex flex-col gap-3">
    <div class="flex items-start justify-between gap-3">
      ${icon}
      <span class="font-mono text-xs px-2 py-1 rounded-md" style="background:#2a2412;color:var(--amber)">#${esc(p.id)}</span>
    </div>
    <div>
      <p class="text-xs font-medium" style="color:var(--teal)">${esc(p.cat)}</p>
      <h3 class="text-lg font-bold mt-1">${esc(p.title)}</h3>
      <p class="text-sm text-[var(--muted)] mt-1">${esc(p.desc)}</p>
    </div>
    <details class="text-sm">
      <summary class="cursor-pointer" style="color:var(--amber)">Benefits</summary>
      <p class="mt-2 whitespace-pre-line text-[#cfd4dc]">${esc(p.benefits)}</p>
    </details>
    <div class="mt-auto pt-2 flex flex-wrap gap-2">
      <a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer nofollow" class="btn btn-primary flex-1 text-center">Visit</a>
      <button data-copy="${esc(p.link)}" class="btn">Copy link</button>
      ${admin}
    </div>
  </article>`;
}

function renderGrid() {
  renderChips();
  const list = posts.filter(matches).sort((a, b) => a.id.localeCompare(b.id));
  $('#grid').innerHTML = list.map(cardHTML).join('');
  show($('#empty'), list.length === 0, 'block');
  $('#count').textContent = `${list.length} of ${posts.length} posts`;
}

/* ---------- Post CRUD ---------- */
function openPost(post = null) {
  const f = $('#postForm');
  f.reset();
  ui.editId = post ? post.id : null;
  $('#postTitle').textContent = post ? `Edit post #${post.id}` : 'New post';
  if (post) {
    f.title.value = post.title; f.cat.value = post.cat; f.link.value = post.link;
    f.desc.value = post.desc; f.benefits.value = post.benefits;
    f.iconUrl.value = post.icon && !post.icon.startsWith('data:') ? post.icon : '';
  }
  show($('#postModal'), true);
  f.title.focus();
}

$('#postForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const v = n => f[n].value.trim();
  if (!/^https?:\/\//i.test(v('link'))) return toast('Enter a valid link starting with http:// or https://');

  const existing = ui.editId ? posts.find(p => p.id === ui.editId) : null;
  let icon = existing ? existing.icon || '' : '';
  try {
    if (f.iconFile.files[0]) icon = await fileToDataURL(f.iconFile.files[0]);
    else if (v('iconUrl')) icon = v('iconUrl');
  } catch { return toast('Could not read that image.'); }

  const data = { title: v('title'), cat: v('cat'), link: v('link'), desc: v('desc'), benefits: v('benefits'), icon };

  if (existing) {
    Object.assign(existing, data);
  } else {
    const n = load(KEY.seq, 0) + 1;           // counter never reuses numbers after deletes
    store(KEY.seq, n);
    posts.push({ id: String(n).padStart(2, '0'), ...data, created: Date.now() });
  }
  if (!persist()) return;
  show($('#postModal'), false);
  renderGrid();
  toast(existing ? 'Post updated.' : 'Post published.');
});

$('#grid').addEventListener('click', async e => {
  const copyBtn = e.target.closest('[data-copy]');
  const editBtn = e.target.closest('[data-edit]');
  const delBtn = e.target.closest('[data-del]');
  if (copyBtn) {
    const text = copyBtn.dataset.copy;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('Referral link copied.');
  } else if (editBtn && ui.admin) {
    openPost(posts.find(p => p.id === editBtn.dataset.edit));
  } else if (delBtn && ui.admin) {
    const p = posts.find(x => x.id === delBtn.dataset.del);
    if (p && confirm(`Delete post #${p.id} "${p.title}"? This cannot be undone.`)) {
      posts = posts.filter(x => x.id !== p.id);
      persist(); renderGrid(); toast('Post deleted.');
    }
  }
});

/* ---------- Profile picture ---------- */
$('#profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.file.files[0]) avatar = await fileToDataURL(f.file.files[0], 160);
    else if (f.url.value.trim()) avatar = f.url.value.trim();
    else return toast('Choose a file or paste an image URL.');
  } catch { return toast('Could not read that image.'); }
  store(KEY.avatar, avatar);
  show($('#profileModal'), false); renderAvatar(); toast('Profile picture updated.');
});
$('#avatarReset').addEventListener('click', () => {
  avatar = ''; localStorage.removeItem(KEY.avatar);
  show($('#profileModal'), false); renderAvatar(); toast('Profile picture removed.');
});

/* ---------- Passcode change ---------- */
$('#passForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const err = msg => $('#passErr').textContent = msg;
  if (await sha256(f.cur.value) !== await currentHash()) return err('Current passcode is incorrect.');
  if (f.next.value.length < 8) return err('Use at least 8 characters.');
  if (f.next.value !== f.confirm.value) return err('New passcodes do not match.');
  localStorage.setItem(KEY.hash, await sha256(f.next.value));
  f.reset(); err(''); show($('#passModal'), false); toast('Passcode updated.');
});

/* ---------- Wiring ---------- */
$('#loginBtn').onclick = () => { show($('#loginModal'), true); $('#loginPw').focus(); };
$('#loginForm').addEventListener('submit', e => { e.preventDefault(); attemptLogin($('#loginPw').value); $('#loginPw').value = ''; });
$('#logoutBtn').onclick = () => { setAdmin(false); toast('Logged out.'); };
$('#newBtn').onclick = () => openPost();
$('#profileBtn').onclick = () => show($('#profileModal'), true);
$('#passBtn').onclick = () => show($('#passModal'), true);
$('#catSelect').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');

$('#search').addEventListener('input', e => { ui.q = e.target.value; renderGrid(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (b) { ui.cat = b.dataset.cat; renderGrid(); }
});

$$('.modal').forEach(m => m.addEventListener('click', e => {
  if (e.target === m || e.target.closest('[data-close]')) show(m, false);
}));
addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.modal').forEach(m => show(m, false));
});

function syncAdminLink() { show($('#loginBtn'), !ui.admin && location.hash === '#admin', 'inline-block'); }
addEventListener('hashchange', syncAdminLink);
addEventListener('keydown', e => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'l') { location.hash = 'admin'; syncAdminLink(); } });
setAdmin(false);
renderGrid();
</script>
</body>
</html>
